name: Android CI - VIP APK & PlayStore AAB

on:
  push:
    branches: [ "main", "develop", "feat/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build VIP Admin APK (Unlimited Lifetime PRO)
        run: ./gradlew assembleVipAdminRelease

      - name: Build Google Play Store Release AAB & APK
        run: ./gradlew bundlePlaystoreRelease assemblePlaystoreRelease

      - name: Upload GamesSub_VIP_Admin.apk
        uses: actions/upload-artifact@v4
        with:
          name: GamesSub_VIP_Admin_APK
          path: app/build/outputs/apk/vipAdmin/release/*.apk

      - name: Upload GamesSub_PlayStore_Release.aab
        uses: actions/upload-artifact@v4
        with:
          name: GamesSub_PlayStore_Release_AAB
          path: app/build/outputs/bundle/playstoreRelease/*.aab

